    <meta charset="UTF-8" />

    <script>
      // Suppress Vite dev-server WebSocket errors in cloud preview iframe (as instructed in environment constraints)
      (function() {
        var originalConsoleError = console.error;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.map(function(a) {
            return (a && (a.message || a.stack)) || String(a || '');
          }).join(' ');
          if (str.indexOf('WebSocket') !== -1 || str.indexOf('closed without opened') !== -1) {
            return;
          }
          originalConsoleError.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && (e.message || (e.error && (e.error.message || e.error.stack)))) || '';
          if (typeof msg === 'string' && (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason && (e.reason.message || e.reason.stack || e.reason)) || '';
          if (typeof reason === 'string' && (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1)) {
            e.preventDefault();
            e.stopImmediatePropagation();
          }
        });
      })();
    </script>
