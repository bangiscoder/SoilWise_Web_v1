<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4332" />
      <stop offset="100%" stop-color="#081c15" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#74c69d" />
      <stop offset="100%" stop-color="#2d6a4f" />
    </linearGradient>
    <linearGradient id="soilGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d4a373" />
      <stop offset="50%" stop-color="#ccd5ae" />
      <stop offset="100%" stop-color="#e9edc9" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Outer glow ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#52b788" stroke-width="4" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="185" fill="none" stroke="#74c69d" stroke-width="2" stroke-opacity="0.4" />

  <!-- Soil / Earth layer curve -->
  <path d="M 120 340 Q 256 310 392 340 Q 360 385 256 385 Q 152 385 120 340 Z" fill="url(#soilGrad)" opacity="0.9" />

  <!-- Sprout Stem & Leaves -->
  <!-- Central sprout stem -->
  <path d="M 256 345 C 256 260 256 210 256 160" stroke="#b7e4c7" stroke-width="14" stroke-linecap="round" />

  <!-- Left Leaf -->
  <path d="M 256 240 C 200 240 160 190 170 145 C 215 145 250 190 256 240 Z" fill="url(#leafGrad)" filter="url(#shadow)" />

  <!-- Right Leaf -->
  <path d="M 256 200 C 315 195 355 145 345 100 C 300 100 262 150 256 200 Z" fill="#52b788" filter="url(#shadow)" />

  <!-- Seed / Nutrient Core -->
  <circle cx="256" cy="345" r="16" fill="#d4a373" stroke="#fff" stroke-width="3" />

  <!-- Small AI Sparkle Accent -->
  <path d="M 360 270 Q 375 270 375 255 Q 375 270 390 270 Q 375 270 375 285 Q 375 270 360 270 Z" fill="#e9edc9" />
  <path d="M 140 260 Q 150 260 150 250 Q 150 260 160 260 Q 150 260 150 270 Q 150 260 140 260 Z" fill="#74c69d" />
</svg>
